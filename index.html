<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Free QR Code Generator</title>
  <meta
    name="description"
    content="Create free QR codes instantly online. Download or copy QR images in one click."
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Free QR Code Generator</h1>
      <p>
        Create QR codes instantly in your browser. No sign-up, no server,
        no tracking needed.
      </p>

      <label for="text">Text or URL</label>
      <textarea
        id="text"
        placeholder="Enter a website link, text, email, Wi-Fi password, or any message..."
      ></textarea>

      <div class="grid">
        <div>
          <label for="size">Size</label>
          <select id="size">
            <option value="200">200 x 200</option>
            <option value="300" selected>300 x 300</option>
            <option value="400">400 x 400</option>
            <option value="512">512 x 512</option>
          </select>
        </div>

        <div>
          <label for="darkColor">QR color</label>
          <input id="darkColor" type="color" value="#000000" />
        </div>

        <div>
          <label for="lightColor">Background color</label>
          <input id="lightColor" type="color" value="#ffffff" />
        </div>
      </div>

      <div class="actions">
        <button id="generateBtn">Generate QR Code</button>
        <button id="downloadBtn" class="secondary">Download PNG</button>
        <button id="copyBtn" class="secondary">Copy QR Image</button>
        <button id="clearBtn" class="secondary">Clear</button>
      </div>

      <div class="preview" id="preview">
        <span class="placeholder-preview">
          Your QR code will appear here
        </span>
        <canvas id="qrCanvas" hidden></canvas>
      </div>

      <div id="status" class="status"></div>

  
    </div>
  </div>

  <!-- QR library MUST load first -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>

  <!-- Your app logic loads second -->
  <script src="script.js"></script>
</body>
</html>
