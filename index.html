<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free QR Code Generator</title>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>

  <style>
    :root {
      --bg: #f7f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #9ca3af;
      --border: #e5e7eb;
      --accent: #111827;
      --success: #166534;
      --error: #991b1b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    }

    h1 {
      margin-top: 0;
      font-size: 2rem;
    }

    p {
      color: #6b7280;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 16px 0 8px;
      font-weight: bold;
    }

    textarea,
    select,
    input[type="color"] {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      background: white;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    textarea::placeholder {
      color: var(--muted);
    }

    input[type="color"] {
      height: 52px;
      padding: 6px;
      cursor: pointer;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 12px;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    button {
      border: 0;
      background: var(--accent);
      color: white;
      padding: 12px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
    }

    button.secondary {
      background: white;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .preview {
      margin-top: 24px;
      text-align: center;
      padding: 20px;
      border: 1px dashed var(--border);
      border-radius: 12px;
      background: #fafafa;
      min-height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      max-width: 100%;
      height: auto;
      display: block;
    }

    .placeholder-preview {
      color: #9ca3af;
      font-size: 0.95rem;
    }

    .status {
      margin-top: 16px;
      min-height: 24px;
      font-size: 0.95rem;
    }

    .success {
      color: var(--success);
    }

    .error {
      color: var(--error);
    }

    .footer {
      margin-top: 18px;
      font-size: 0.9rem;
      color: #6b7280;
      text-align: center;
    }

    @media (max-width: 640px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Free QR Code Generator</h1>
      <p>Create QR codes instantly in your browser. No sign-up, no server, no tracking needed.</p>

      <label for="text">Text or URL</label>
      <textarea
        id="text"
        placeholder="Enter a website link, text, email, Wi-Fi password, or any message..."
      ></textarea>

      <div class="grid">
        <div>
          <label for="size">Size</label>
          <select id="size">
            <option value="200">200 x 200</option>
            <option value="300" selected>300 x 300</option>
            <option value="400">400 x 400</option>
            <option value="512">512 x 512</option>
          </select>
        </div>

        <div>
          <label for="darkColor">QR color</label>
          <input id="darkColor" type="color" value="#000000" />
        </div>

        <div>
          <label for="lightColor">Background color</label>
          <input id="lightColor" type="color" value="#ffffff" />
        </div>
      </div>

      <div class="actions">
        <button id="generateBtn">Generate QR Code</button>
        <button id="downloadBtn" class="secondary">Download PNG</button>
        <button id="copyBtn" class="secondary">Copy QR Image</button>
        <button id="clearBtn" class="secondary">Clear</button>
      </div>

      <div class="preview" id="preview">
        <span class="placeholder-preview">Your QR code will appear here</span>
        <canvas id="qrCanvas" hidden></canvas>
      </div>

      <div id="status" class="status"></div>

      <div class="footer">
        Built as a static HTML tool — perfect for GitHub Pages.
      </div>
    </div>
  </div>

  <script>
    const textEl = document.getElementById("text");
    const sizeEl = document.getElementById("size");
    const darkColorEl = document.getElementById("darkColor");
    const lightColorEl = document.getElementById("lightColor");
    const canvas = document.getElementById("qrCanvas");
    const preview = document.getElementById("preview");
    const statusEl = document.getElementById("status");

    function setStatus(message, type = "") {
      statusEl.textContent = message;
      statusEl.className = "status " + type;
    }

    function normalizeInput(value) {
      const trimmed = value.trim();

      if (!trimmed) return "";

      if (
        /^[a-zA-Z0-9-]+\.[a-zA-Z]{2,}/.test(trimmed) &&
        !/^https?:\/\//i.test(trimmed)
      ) {
        return "https://" + trimmed;
      }

      return trimmed;
    }

    async function generateQRCode() {
      const text = normalizeInput(textEl.value);
      const width = Number(sizeEl.value);
      const dark = darkColorEl.value;
      const light = lightColorEl.value;

      if (!text) {
        setStatus("Please enter text or a URL.", "error");
        return;
      }

      try {
        await QRCode.toCanvas(canvas, text, {
          width: width,
          errorCorrectionLevel: "M",
          margin: 2,
          color: {
            dark: dark,
            light: light
          }
        });

        canvas.hidden = false;

        const placeholder = preview.querySelector(".placeholder-preview");
        if (placeholder) placeholder.remove();

        setStatus("QR code generated.", "success");
      } catch (err) {
        console.error(err);
        setStatus("Could not generate the QR code.", "error");
      }
    }

    function downloadQRCode() {
      if (!canvas.width) {
        setStatus("Generate a QR code first.", "error");
        return;
      }

      const link = document.createElement("a");
      link.download = "qr-code.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    }

    async function copyQRCode() {
      if (!canvas.width) {
        setStatus("Generate a QR code first.", "error");
        return;
      }

      try {
        const blob = await new Promise(resolve =>
          canvas.toBlob(resolve, "image/png")
        );

        await navigator.clipboard.write([
          new ClipboardItem({
            "image/png": blob
          })
        ]);

        setStatus("QR image copied.", "success");
      } catch (err) {
        setStatus("Copy failed. Use download instead.", "error");
      }
    }

    function clearForm() {
      textEl.value = "";

      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      canvas.width = 0;
      canvas.height = 0;
      canvas.hidden = true;

      if (!preview.querySelector(".placeholder-preview")) {
        preview.insertAdjacentHTML(
          "afterbegin",
          '<span class="placeholder-preview">Your QR code will appear here</span>'
        );
      }

      setStatus("");
    }

    document.getElementById("generateBtn").onclick = generateQRCode;
    document.getElementById("downloadBtn").onclick = downloadQRCode;
    document.getElementById("copyBtn").onclick = copyQRCode;
    document.getElementById("clearBtn").onclick = clearForm;
  </script>
</body>
</html>
