<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free QR Code Generator</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #f7f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #111827;
      --success: #166534;
      --error: #991b1b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    }

    h1 {
      margin-top: 0;
      font-size: 2rem;
    }

    p {
      color: var(--muted);
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 16px 0 8px;
      font-weight: bold;
    }

    textarea, select, input[type="color"] {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 12px;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    button {
      border: 0;
      background: var(--accent);
      color: white;
      padding: 12px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
    }

    button.secondary {
      background: white;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .preview {
      margin-top: 24px;
      text-align: center;
      padding: 20px;
      border: 1px dashed var(--border);
      border-radius: 12px;
      background: #fafafa;
    }

    canvas {
      max-width: 100%;
      height: auto;
    }

    .status {
      margin-top: 16px;
      min-height: 24px;
      font-size: 0.95rem;
      color: var(--muted);
    }

    .status.success {
      color: var(--success);
    }

    .status.error {
      color: var(--error);
    }

    .footer {
      margin-top: 18px;
      font-size: 0.9rem;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 640px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Free QR Code Generator</h1>
      <p>Create QR codes instantly in your browser. No sign-up, no server, no tracking needed.</p>

      <label for="text">Text or URL</label>
      <textarea id="text" placeholder="Enter a website link, text, email, Wi-Fi config, etc.">https://example.com</textarea>

      <div class="grid">
        <div>
          <label for="size">Size</label>
          <select id="size">
            <option value="200">200 x 200</option>
            <option value="300" selected>300 x 300</option>
            <option value="400">400 x 400</option>
            <option value="512">512 x 512</option>
          </select>
        </div>

        <div>
          <label for="level">Error correction</label>
          <select id="level">
            <option value="L">Low</option>
            <option value="M" selected>Medium</option>
            <option value="Q">Quartile</option>
            <option value="H">High</option>
          </select>
        </div>

        <div>
          <label for="darkColor">QR color</label>
          <input id="darkColor" type="color" value="#000000" />
        </div>

        <div>
          <label for="lightColor">Background color</label>
          <input id="lightColor" type="color" value="#ffffff" />
        </div>
      </div>

      <div class="actions">
        <button id="generateBtn">Generate QR Code</button>
        <button id="downloadBtn" class="secondary">Download PNG</button>
        <button id="copyBtn" class="secondary">Copy QR Image</button>
        <button id="clearBtn" class="secondary">Clear</button>
      </div>

      <div class="preview">
        <canvas id="qrCanvas"></canvas>
      </div>

      <div id="status" class="status" aria-live="polite"></div>

      <div class="footer">
        Built as a static HTML tool — perfect for GitHub Pages.
      </div>
    </div>
  </div>

  <script>
    const textEl = document.getElementById("text");
    const sizeEl = document.getElementById("size");
    const levelEl = document.getElementById("level");
    const darkColorEl = document.getElementById("darkColor");
    const lightColorEl = document.getElementById("lightColor");
    const canvas = document.getElementById("qrCanvas");
    const generateBtn = document.getElementById("generateBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const copyBtn = document.getElementById("copyBtn");
    const clearBtn = document.getElementById("clearBtn");
    const statusEl = document.getElementById("status");

    function setStatus(message, type = "") {
      statusEl.textContent = message;
      statusEl.className = "status";
      if (type) statusEl.classList.add(type);
    }

    async function generateQRCode() {
      const text = textEl.value.trim();
      const width = Number(sizeEl.value);
      const errorCorrectionLevel = levelEl.value;
      const dark = darkColorEl.value;
      const light = lightColorEl.value;

      if (!text) {
        setStatus("Please enter some text or a URL.", "error");
        return;
      }

      try {
        await QRCode.toCanvas(canvas, text, {
          width,
          errorCorrectionLevel,
          color: { dark, light },
          margin: 2
        });
        setStatus("QR code generated.", "success");
      } catch (err) {
        console.error(err);
        setStatus("Could not generate the QR code.", "error");
      }
    }

    function downloadQRCode() {
      if (!canvas.width || !canvas.height) {
        setStatus("Generate a QR code first.", "error");
        return;
      }

      const link = document.createElement("a");
      link.download = "qr-code.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
      setStatus("PNG download started.", "success");
    }

    async function copyQRCode() {
      if (!canvas.width || !canvas.height) {
        setStatus("Generate a QR code first.", "error");
        return;
      }

      if (!navigator.clipboard || !window.ClipboardItem) {
        setStatus("Image copy is not supported in this browser. Try Download PNG instead.", "error");
        return;
      }

      try {
        const blob = await new Promise((resolve) => {
          canvas.toBlob(resolve, "image/png");
        });

        if (!blob) {
          throw new Error("Failed to create image blob.");
        }

        const item = new ClipboardItem({
          "image/png": blob
        });

        await navigator.clipboard.write([item]);
        setStatus("QR image copied to clipboard.", "success");
      } catch (err) {
        console.error(err);
        setStatus("Copy failed. Your browser may block image copying. Try Download PNG instead.", "error");
      }
    }

    function clearForm() {
      textEl.value = "";
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      canvas.width = 0;
      canvas.height = 0;
      setStatus("Cleared.");
    }

    generateBtn.addEventListener("click", generateQRCode);
    downloadBtn.addEventListener("click", downloadQRCode);
    copyBtn.addEventListener("click", copyQRCode);
    clearBtn.addEventListener("click", clearForm);

    window.addEventListener("load", generateQRCode);
  </script>
</body>
</html>
